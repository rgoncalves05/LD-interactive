<style>
  body { margin: 0; background: #FAF6EC; color: #12231C; font-family: 'DM Sans', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  h1, h2, h3 { font-family: 'Anton', Impact, sans-serif; font-weight: 400; letter-spacing: 0.01em; margin: 0; }
  a { text-decoration: none; }
  .btn { transition: transform .15s ease, box-shadow .15s ease; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 rgba(0,0,0,.18); }
  .chip { cursor: pointer; transition: background .15s ease, color .15s ease; }
  .chip:hover { background: #E3EFE8; }
  @keyframes drawPath { 0% { stroke-dashoffset: 1000; } 89% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
  @keyframes moveDot { 0% { offset-distance: 0%; opacity: 1; } 89% { offset-distance: 100%; opacity: 1; } 96% { offset-distance: 100%; opacity: 0; } 100% { offset-distance: 0%; opacity: 0; } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .hero-path { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: drawPath 9s linear infinite; }
  .hero-dot { offset-path: path('M330,589 L442,477 A80.6,80.6 0 0 1 556,477 L620,541 A90.5,90.5 0 0 1 556,695.5 L428,695 A80,80 0 0 0 371.4,831.6 L423,884 A80.6,80.6 0 0 0 537,884 L640,781'); offset-rotate: 0deg; animation: moveDot 9s linear infinite; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .hero-path { animation: none; stroke-dashoffset: 0; } .hero-dot, .pulse { animation: none; } }
</style>
<script>/* Idioma compartilhado (landing + jogo): escolha manual > país por IP (guardado) > fuso/idioma do navegador */
(function () {
  var K = 'bw_lang', A = 'bw_lang_auto';
  function ls(k, v) { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch (e) { return null; } }
  function ok(v) { return v === 'pt' || v === 'en'; }
  function guess() {
    try {
      var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
      if (/^America\/(Sao_Paulo|Bahia|Fortaleza|Recife|Belem|Manaus|Cuiaba|Campo_Grande|Porto_Velho|Rio_Branco|Boa_Vista|Araguaina|Maceio|Noronha|Santarem|Eirunepe)$/.test(tz)) return 'pt';
    } catch (e) {}
    return String(navigator.language || 'en').toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en';
  }
  var manual = ls(K), auto = ls(A);
  var BW = window.BW = { lang: ok(manual) ? manual : ok(auto) ? auto : guess(), onchange: null };
  BW.set = function (l) { if (!ok(l)) return; ls(K, l); BW.lang = l; };
  BW.flags = {
    pt: '<svg viewBox="0 0 30 21" width="30" height="21" aria-hidden="true"><rect width="30" height="21" fill="#009b3a"/><polygon points="15,2.2 27.5,10.5 15,18.8 2.5,10.5" fill="#fedf00"/><circle cx="15" cy="10.5" r="4.7" fill="#002776"/><path d="M10.6 9.6 Q15 8.2 19.4 11.6" stroke="#fff" stroke-width="1" fill="none"/></svg>',
    en: '<svg viewBox="0 0 30 21" width="30" height="21" aria-hidden="true"><rect width="30" height="21" fill="#fff"/><g fill="#b22234"><rect y="0" width="30" height="3"/><rect y="6" width="30" height="3"/><rect y="12" width="30" height="3"/><rect y="18" width="30" height="3"/></g><rect width="13" height="12" fill="#3c3b6e"/><g fill="#fff"><circle cx="2.5" cy="2.2" r=".7"/><circle cx="6.5" cy="2.2" r=".7"/><circle cx="10.5" cy="2.2" r=".7"/><circle cx="4.5" cy="5.2" r=".7"/><circle cx="8.5" cy="5.2" r=".7"/><circle cx="2.5" cy="8.2" r=".7"/><circle cx="6.5" cy="8.2" r=".7"/><circle cx="10.5" cy="8.2" r=".7"/></g></svg>'
  };
  if (!ok(manual) && typeof fetch === 'function') {
    var apply = function (c) {
      if (!c) return false;
      var l = String(c).trim().toUpperCase() === 'BR' ? 'pt' : 'en';
      ls(A, l);
      if (!ok(ls(K)) && l !== BW.lang) { BW.lang = l; if (BW.onchange) BW.onchange(l); }
      return true;
    };
    var get = function (url, pick) {
      var ctl = (typeof AbortController === 'function') ? new AbortController() : null;
      var to = setTimeout(function () { if (ctl) ctl.abort(); }, 2500);
      return fetch(url, { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
        .then(function (r) { clearTimeout(to); return r.ok ? pick(r) : null; })
        .catch(function () { clearTimeout(to); return null; });
    };
    get('https://api.country.is/', function (r) { return r.json().then(function (j) { return j && j.country; }); })
      .then(function (c) { if (!apply(c)) return get('https://ipapi.co/country/', function (r) { return r.text(); }).then(apply); });
  }
})();
</script>

<script type="text/template" id="tpl-dyn-pt"><!-- REGRAS -->

            <sc-if value="{{cur.is4}}" hint-placeholder-val="{{ false }}">
              <svg viewBox="0 0 220 130" style="width:100%; display:block;"><line x1="30" y1="60" x2="190" y2="60" stroke="#8e44ad" stroke-width="12" stroke-linecap="round"/><path d="M110,125 L110,86 M110,40 L110,8" stroke="#12231C" stroke-width="5" fill="none" stroke-linecap="round"/><text x="122" y="70" font-size="13" font-weight="700" fill="#B3261E">+4s</text></svg>
            </sc-if>
            <sc-if value="{{cur.is5}}" hint-placeholder-val="{{ false }}">
              <svg viewBox="0 0 220 130" style="width:100%; display:block;"><line x1="30" y1="25" x2="190" y2="25" stroke="#e74c3c" stroke-width="12" stroke-linecap="round"/><path d="M110,125 L110,85 C70,85 70,55 100,55 C130,55 130,95 100,95 C80,95 85,70 110,60 L110,30" stroke="#12231C" stroke-width="5" fill="none" stroke-linecap="round"/><text x="140" y="80" font-size="13" font-weight="700" fill="#B3261E">+5s</text></svg>
            </sc-if>
          </div>
          <div style="text-align:center; font-weight:700; color:#B3261E; margin-top:8px;">✘ Wrong</div>
        </div>
      </div>
    </div>
  </div>

  <!-- SIMULADOR DE CURVA -->
  <div style="max-width:1200px; margin:0 auto; padding:50px 40px;">
    <div style="display:flex; flex-wrap:wrap; gap:30px; background:#E3EFE8; border-radius:26px; padding:38px; align-items:center;">
      <div style="flex:1 1 380px; min-width:0;">
        <div style="color:#0D7A55; font-weight:700; letter-spacing:.1em; font-size:13px;">TRY IT YOURSELF</div>
        <h2 style="font-size:46px; margin:8px 0 12px;">THE GLASS OF WATER ON THE PASSENGER SEAT</h2>
        <p style="font-size:18px; line-height:1.6; color:#3B4A43; margin:0 0 20px;">Wide turn: the water barely moves. Sharp turn: it spills everywhere. Drag the slider and see when the judge gets annoyed.</p>
        <input type="range" min="0" max="130" step="1" value="{{angleVal}}" onInput="{{onAngle}}" style="width:100%; accent-color:#0D7A55;">
        <div style="display:flex; justify-content:space-between; font-size:13px; color:#3B4A43;"><span>straight</span><span>U-turn</span></div>
        <div style="display:flex; align-items:center; gap:14px; margin-top:20px; flex-wrap:wrap;">
          <div style="font-family:'Anton',sans-serif; font-size:54px; min-width:110px;" id="ang-val">{{angleVal}}°</div>
          <div id="ang-verdict" style="background:{{angleColor}}; color:#fff; padding:10px 18px; border-radius:12px; font-weight:700;">{{angleVerdict}}</div>
        </div>
      </div>
      <div style="flex:1 1 300px; min-width:0; display:flex; justify-content:center;">
        <div style="background:#E8D5A3; border-radius:20px; padding:12px; width:100%; max-width:340px;">
          <svg viewBox="0 0 200 200" style="width:100%; display:block;"><path id="ang-path" d="{{curveD}}" stroke="#12231C" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="100" r="7" fill="#0D7A55"/><circle id="ang-dot" cx="{{curveX}}" cy="{{curveY}}" r="9" fill="{{angleColor}}" stroke="#fff" stroke-width="3"/></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- MEDALHAS -->
  <div style="max-width:1200px; margin:0 auto; padding:30px 40px 70px;">
    <h2 style="font-size:56px;">HOW MUCH IS YOUR RUN WORTH?</h2>
    <p style="font-size:19px; color:#3B4A43; margin:12px 0 26px; max-width:680px;">It works like a report card: every mistake takes off a point. Move the counter and see the grade.</p>
    <div style="display:flex; flex-wrap:wrap; gap:26px; align-items:stretch;">
      <div style="flex:1 1 320px; background:#fff; border-radius:24px; padding:30px; box-shadow:0 10px 0 #E4DCC6; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;">
        <div style="font-weight:700; color:#3B4A43;">Errors in the run</div>
        <div style="display:flex; align-items:center; gap:22px;">
          <div class="chip" onClick="{{errMinus}}" style="width:52px; height:52px; border-radius:50%; border:2px solid #0D7A55; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:700; color:#0D7A55; user-select:none;">−</div>
          <div style="font-family:'Anton',sans-serif; font-size:76px; min-width:70px; text-align:center;">{{errs}}</div>
          <div class="chip" onClick="{{errPlus}}" style="width:52px; height:52px; border-radius:50%; border:2px solid #0D7A55; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:700; color:#0D7A55; user-select:none;">+</div>
        </div>
      </div>
      <div style="flex:1 1 320px; border-radius:24px; padding:30px; background:{{medalBg}}; color:{{medalFg}}; display:flex; flex-direction:column; justify-content:center; gap:8px;">
        <div style="font-size:14px; letter-spacing:.12em; font-weight:700;">{{medalName}}</div>
        <div style="font-family:'Anton',sans-serif; font-size:58px;">{{medalTitle}}</div>
        <div style="font-size:17px; line-height:1.5;">{{medalText}}</div>
      </div>
    </div>
    <div style="display:flex; flex-wrap:wrap; gap:12px; margin-top:22px; font-size:14px; color:#3B4A43;">
      <span style="background:#fff; padding:8px 14px; border-radius:999px;"><b>0 errors</b> gold</span>
      <span style="background:#fff; padding:8px 14px; border-radius:999px;"><b>1 a 2</b> silver</span>
      <span style="background:#fff; padding:8px 14px; border-radius:999px;"><b>3 a 5</b> bronze</span>
      <span style="background:#fff; padding:8px 14px; border-radius:999px;"><b>6 or more</b> keep trying</span>
    </div>
    <p style="font-size:16px; line-height:1.6; color:#3B4A43; margin:22px 0 0; max-width:780px;">Time counts too: each error adds seconds to your real time, making the <b>adjusted time</b>. And if a turn goes past 100°, or the horse enters and leaves through the wrong door, it is an instant disqualification.</p>
  </div>

  <!-- PERCURSOS -->
  <div id="pistas" style="background:#12231C; color:#FAF6EC; padding:80px 40px;">
    <div style="max-width:1200px; margin:0 auto;">
      <h2 style="font-size:56px;">SIX COURSES TO MASTER</h2>
      <p style="font-size:19px; color:#B8CBC1; margin:12px 0 28px; max-width:680px;">From warm-up to championship challenge. Tap a course to see what to expect.</p>
      <div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:22px;">
        <sc-for list="{{forms}}" as="f" hint-placeholder-count="6">
          <div class="chip" onClick="{{f.pick}}" style="padding:12px 20px; border-radius:999px; font-weight:700; font-size:15px; border:2px solid #3DD9A0; background:{{f.bg}}; color:{{f.fg}};">{{f.label}}</div>
        </sc-for>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:26px; background:#1B3328; border-radius:26px; padding:34px;">
        <div style="flex:1 1 340px; min-width:0;">
          <div style="display:inline-block; background:#3DD9A0; color:#12231C; font-weight:700; font-size:13px; letter-spacing:.1em; padding:6px 12px; border-radius:999px;">{{form.level}}</div>
          <h3 style="font-size:44px; margin:12px 0 10px;">{{form.name}}</h3>
          <div style="color:#3DD9A0; font-weight:700; margin-bottom:12px;">{{form.count}}</div>
          <p style="font-size:18px; line-height:1.6; margin:0; color:#CFDDD5;">{{form.desc}}</p>
          <div style="margin-top:16px; background:#12231C; border-radius:14px; padding:14px 16px; line-height:1.55; color:#CFDDD5;"><b style="color:#3DD9A0;">Tip:</b> {{form.tip}}</div>
        </div>
        <div style="flex:1 1 300px; min-width:0; display:flex; justify-content:center;">
          <div style="background:#F0F2F6; border-radius:20px; padding:12px; width:100%; max-width:360px;">
            <img src="{{form.img}}" alt="{{form.name}}" style="width:100%; display:block; border-radius:12px;"/>
          </div>
        </div>
      </div>
      <div style="margin-top:26px; background:#1B3328; border-radius:22px; padding:28px; display:flex; flex-wrap:wrap; gap:22px; align-items:center;">
        <div style="flex:1 1 360px; min-width:0;">
          <h3 style="font-size:32px; margin-bottom:10px;">THE SHAMROCK RULE</h3>
          <p style="margin:0; line-height:1.65; color:#CFDDD5;">Imagine a four-leaf clover with four doors. You start outside, and the first obstacle you cross picks your main pair: it and its opposite must each be crossed <b>3 times</b>; the other pair, <b>2 times</b>. Enter through one door, leave through the opposite, or you are disqualified.</p>
        </div>
        <div style="flex:1 1 200px; display:flex; gap:12px; justify-content:center;">
          <div style="background:#12231C; border-radius:14px; padding:14px 18px; text-align:center;"><div style="font-family:'Anton',sans-serif; font-size:42px; color:#3DD9A0;">3×</div><div style="font-size:13px; color:#B8CBC1;">main pair</div></div>
          <div style="background:#12231C; border-radius:14px; padding:14px 18px; text-align:center;"><div style="font-family:'Anton',sans-serif; font-size:42px; color:#F5C36B;">2×</div><div style="font-size:13px; color:#B8CBC1;">other pair</div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- RECURSOS -->
  <div style="max-width:1200px; margin:0 auto; padding:80px 40px 40px;">
    <h2 style="font-size:56px;">EVERYTHING ON THE COURSE</h2>
    <div style="display:flex; flex-wrap:wrap; gap:20px; margin-top:30px;">
      <sc-for list="{{features}}" as="ft" hint-placeholder-count="6">
        <div style="flex:1 1 300px; background:#fff; border-radius:20px; padding:26px; box-shadow:0 8px 0 #E4DCC6;">
          <div style="width:46px; height:46px; border-radius:12px; background:#E3EFE8; color:#0D7A55; display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:22px;">{{ft.n}}</div>
          <h3 style="font-size:26px; margin:14px 0 8px;">{{ft.title}}</h3>
          <p style="margin:0; line-height:1.6; color:#3B4A43;">{{ft.text}}</p>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- FAQ -->
  <div id="faq" style="max-width:900px; margin:0 auto; padding:60px 40px 60px;">
    <h2 style="font-size:56px; margin-bottom:26px;">QUICK QUESTIONS</h2>
    <sc-for list="{{faq}}" as="q" hint-placeholder-count="5">
      <div style="background:#fff; border-radius:16px; margin-bottom:12px; overflow:hidden;">
        <div class="chip" onClick="{{q.toggle}}" style="display:flex; justify-content:space-between; gap:14px; padding:20px 24px; font-weight:700; font-size:18px;">
          <span>{{q.q}}</span><span style="color:#0D7A55; font-size:24px; line-height:1;">{{q.sign}}</span>
        </div>
        <sc-if value="{{q.open}}" hint-placeholder-val="{{ false }}">
          <div style="padding:0 24px 22px; line-height:1.65; color:#3B4A43;">{{q.a}}</div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <!-- CTA FINAL -->
  <div style="background:#0D7A55; color:#fff; padding:90px 40px; text-align:center;">
    <h2 style="font-size:72px; line-height:1;">THE ARENA IS OPEN.</h2>
    <p style="font-size:21px; margin:18px auto 34px; max-width:560px; line-height:1.5;">One finger, six courses and no knot in the rope. How long will it take you to ride a perfect run?</p>
    <a class="btn" href="jogo.html?v=5" style="display:inline-block; background:#FAF6EC; color:#12231C; padding:20px 44px; border-radius:16px; font-weight:700; font-size:20px; box-shadow:0 7px 0 rgba(0,0,0,.25);">Play Butterfly Way</a>
  </div>

  <div style="padding:26px 40px; text-align:center; font-size:14px; color:#3B4A43;">Butterfly Way · equestrian jumping puzzle for your browser</div>
</script>
<script>
class DCLogic{constructor(p){this.props=p||{};this.state={};}
 setState(p){Object.assign(this.state,p);render();}
 live(){const v=this.renderVals();const g=id=>document.getElementById(id);
  g('ang-val').textContent=v.angleVal+'°';const vd=g('ang-verdict');vd.textContent=v.angleVerdict;vd.style.background=v.angleColor;
  g('ang-path').setAttribute('d',v.curveD);const d=g('ang-dot');d.setAttribute('cx',v.curveX);d.setAttribute('cy',v.curveY);d.setAttribute('fill',v.angleColor);}}
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { rule: 0, angle: 50, errs: 0, form: 0, faq: -1 };
  }
  renderVals() {
    const s = this.state;
    const en = (window.BW && BW.lang === 'en');
    const T = (pt, e) => en ? e : pt;
    const R = en ? [
      { label: '1 · Cross once', analogy: 'THE SUBWAY TURNSTILE',
        story: 'Nobody goes through the same turnstile twice on one ticket. Every obstacle works the same way: you cross, and that is it.',
        rule: 'Each obstacle is crossed only once. Crossing again puts a marker on the map (no extra seconds).', penalty: 'Marker only, no time penalty' },
      { label: '2 · Enter straight', analogy: 'THREADING THE NEEDLE',
        story: 'If you come in sideways, the thread will not pass. To go through the hole, aim straight at it.',
        rule: 'Approach the obstacle at a 90° angle, with 20° of leeway either way.', penalty: 'Outside the leeway: +5 seconds' },
      { label: '3 · Aim for the middle', analogy: 'THE PENALTY KICK AT THE CENTER OF THE GOAL',
        story: 'Kicking at the corner is risky. The safe zone is the middle, where the keeper hardly has to move.',
        rule: 'Cross the obstacle through the middle third: up to 25 px either side of the center of its 150 px.', penalty: 'Off the middle: +3 seconds' },
      { label: '4 · Smooth turns', analogy: 'THE FULL GLASS ON THE PASSENGER SEAT',
        story: 'To avoid spilling, you take wide, lazy turns. Hard braking and sharp steering soak the seat.',
        rule: 'Up to 65° a turn is accepted. From 65° to 100° (or a very tight curve) it costs time. Above 100° you are disqualified.', penalty: '65° to 100°: +3 s · Above 100°: disqualified' },
      { label: '5 · Do not stop', analogy: 'DRAWING WITHOUT LIFTING THE PEN',
        story: 'Whoever lifts the pen mid-stroke has to restart the movement. The horse does not like stopping in the middle of the course either.',
        rule: 'Keep your finger on the screen for the whole run and do not stay still for more than 2 seconds.', penalty: 'Finger lifted: +4 seconds' },
      { label: '6 · No knots', analogy: 'DO NOT TIE A KNOT IN THE ROPE',
        story: 'A taut rope goes from A to B. If it makes a loop, you lost time and tangled everything.',
        rule: 'Avoid loops, circles or turns over your own path.', penalty: 'Loop: +5 seconds' }
    ] : [
      { label: '1 · Cruze uma vez', analogy: 'O TORNIQUETE DO METRÔ',
        story: 'Ninguém passa duas vezes pela mesma catraca com o mesmo bilhete. Cada obstáculo funciona igual: você atravessa, e pronto.',
        rule: 'Cada obstáculo é cruzado uma única vez. Cruzar de novo marca um erro no mapa (sem segundos extras).', penalty: 'Erro marcado, sem punição em segundos' },
      { label: '2 · Entre reto', analogy: 'ENFIAR A LINHA NA AGULHA',
        story: 'Se você chega de lado, a linha não passa. Para entrar no buraco, aponte de frente.',
        rule: 'Chegue ao obstáculo em ângulo de 90°, com folga de 20° para mais ou para menos.', penalty: 'Fora da folga: +5 segundos' },
      { label: '3 · Mire no meio', analogy: 'O PÊNALTI NO CENTRO DO GOL',
        story: 'Chutar no canto é arriscado. A zona segura fica no meio, onde o goleiro nem precisa se mexer.',
        rule: 'Cruze o obstáculo pelo terço do meio, até 25 px para cada lado do centro de 150 px.', penalty: 'Fora do meio: +3 segundos' },
      { label: '4 · Curvas suaves', analogy: 'O COPO CHEIO NO BANCO DO CARONA',
        story: 'Para não derramar, você faz curvas largas e preguiçosas. Freada e volante bruscos molham o banco.',
        rule: 'Até 65° a curva é aceita. De 65° a 100° (ou curva muito apertada) custa tempo. Acima de 100° é desclassificação.', penalty: '65° a 100°: +3 s · Acima de 100°: desclassificado' },
      { label: '5 · Sem parar', analogy: 'DESENHAR SEM TIRAR A CANETA',
        story: 'Quem levanta a caneta no meio do traço precisa recomeçar o movimento. O cavalo também não gosta de parar no meio da pista.',
        rule: 'Mantenha o dedo na tela o percurso todo e não fique parado por mais de 2 segundos.', penalty: 'Dedo levantado: +4 segundos' },
      { label: '6 · Sem nós', analogy: 'NÃO DÊ NÓ NA CORDA',
        story: 'Uma corda esticada vai de A a B. Se ela faz uma laçada, você perdeu tempo e ainda embaraçou tudo.',
        rule: 'Evite fazer laços, círculos ou voltas sobre o seu próprio caminho.', penalty: 'Laço: +5 segundos' }
    ];
    const rules = R.map((r, i) => ({ label: r.label, bg: i === s.rule ? '#0D7A55' : '#fff', fg: i === s.rule ? '#fff' : '#0D7A55', pick: () => this.setState({ rule: i }) }));
    const cur = Object.assign({}, R[s.rule]);
    for (let i = 0; i < 6; i++) cur['is' + i] = s.rule === i;

    // curva
    const a = s.angle, rad = a * Math.PI / 180;
    const ex = 100 + 70 * Math.cos(rad), ey = 100 - 70 * Math.sin(rad);
    let verdict, col;
    if (a <= 35) { verdict = T('Curva de mestre. Sem punição.', 'Master-class turn. No penalty.'); col = '#0D7A55'; }
    else if (a <= 65) { verdict = T('Aceitável. Sem punição.', 'Acceptable. No penalty.'); col = '#4C9A2A'; }
    else if (a <= 100) { verdict = T('Cuidado: +3 segundos.', 'Careful: +3 seconds.'); col = '#D98A00'; }
    else { verdict = T('Desclassificado!', 'Disqualified!'); col = '#B3261E'; }

    // medalha
    const e = s.errs;
    let m;
    if (e === 0) m = en ? { n: 'GOLD MEDAL', t: 'PERFECT!', x: 'No errors. The horse flew around the course.', bg: '#F5C36B', fg: '#12231C' } : { n: 'MEDALHA DE OURO', t: 'PERFEITO!', x: 'Nenhum erro. O cavalo voou pela pista.', bg: '#F5C36B', fg: '#12231C' };
    else if (e <= 2) m = en ? { n: 'SILVER MEDAL', t: 'ALMOST THERE!', x: 'Nearly flawless. One or two details and gold is yours.', bg: '#D5DBD8', fg: '#12231C' } : { n: 'MEDALHA DE PRATA', t: 'QUASE LÁ!', x: 'Quase impecável. Um detalhe ou dois e o ouro é seu.', bg: '#D5DBD8', fg: '#12231C' };
    else if (e <= 5) m = en ? { n: 'BRONZE MEDAL', t: 'GOOD EFFORT!', x: 'You have the basics. Focus on the turns and the middle of the obstacles.', bg: '#E0A877', fg: '#12231C' } : { n: 'MEDALHA DE BRONZE', t: 'BOM ESFORÇO!', x: 'Já domina o básico. Foque nas curvas e no meio dos obstáculos.', bg: '#E0A877', fg: '#12231C' };
    else m = en ? { n: 'NO MEDAL', t: 'KEEP TRYING!', x: 'Breathe, slow down and use the replay to find the mistakes.', bg: '#12231C', fg: '#FAF6EC' } : { n: 'SEM MEDALHA', t: 'CONTINUE TENTANDO!', x: 'Respire, vá mais devagar e use o replay para achar os erros.', bg: '#12231C', fg: '#FAF6EC' };

    // percursos
    const mk = (pts, c) => pts.map((p, i) => ({ x1: p[0], y1: p[1], x2: p[2], y2: p[3], c: c[i % c.length] }));
    const C = ['#e74c3c', '#2980b9', '#f1c40f', '#27ae60', '#8e44ad', '#e67e22', '#16a085', '#c0392b'];
    const G = [
      { count: 5, rails: [[40,60,80,20],[120,20,160,60],[75,100,125,100],[40,140,80,180],[120,180,160,140]], d: 'M20,100 L50,50 Q100,5 150,50 L120,100 Q100,100 80,100 L50,150 Q100,195 150,150 L190,110' },
      { count: 5, rails: [[60,40,100,80],[60,160,100,120],[100,100,100,60],[140,40,180,80],[140,160,180,120]], d: 'M20,60 L80,60 Q100,100 80,140 L130,150 Q100,100 130,50 L190,70' },
      { count: 5, rails: [[40,90,40,110],[100,40,100,70],[100,130,100,160],[160,90,160,110],[100,90,100,110]], d: 'M20,100 C20,40 90,40 100,100 C110,160 180,160 180,100 C180,40 110,40 100,100 C90,160 20,160 20,100' },
      { count: 4, rails: [[100,50,100,80],[100,120,100,150],[50,100,80,100],[120,100,150,100]], d: 'M20,100 L100,100 Q130,40 100,60 L100,140 Q60,180 50,100 L90,100' },
      { count: 13, rails: [[20,30,50,30],[80,30,110,30],[140,30,170,30],[20,80,50,80],[80,80,110,80],[140,80,170,80],[20,130,50,130],[80,130,110,130],[140,130,170,130],[50,170,80,170],[110,170,140,170],[160,55,160,70],[40,55,40,70]], d: 'M10,40 L190,40 L190,90 L10,90 L10,140 L190,140 L150,175 L40,175' },
      { count: 8, rails: [[30,60,60,60],[30,140,60,140],[70,100,100,100],[110,20,110,50],[110,150,110,180],[140,100,170,100],[140,60,170,60],[140,140,170,140]], d: 'M10,100 L60,60 Q100,10 110,50 L110,150 Q100,190 60,140 L20,100 L120,100 L170,60 L175,140 L120,100' }
    ];
    const FT = en ? [
      ['Butterfly Way', 'CLASSIC', 'The course that gives the game its name: four slanted obstacles forming the wings, with one striped obstacle in the middle, the body of the butterfly.', 'Think of flying through the middle of an X: wide curves, always moving forward.'],
      ['Horizontal Butterfly', 'VARIATION', 'The same idea, lying down. The striped body is now horizontal and the wings open to the left and right.', 'Always look at the next obstacle, not the one you just passed.'],
      ['Lemniscate', 'FLOWING', 'Five slanted obstacles stacked in a zigzag column, one after the other. Smooth, alternating turns reward a light hand.', 'Imagine slalom skiing: swing left, swing right, keep your rhythm.'],
      ['Shamrock', 'STRATEGIC', 'The clover: four obstacles in a square and the 3-and-2 crossing rule. Here the order matters as much as precision.', 'Decide the main pair at the very first crossing and count out loud.'],
      ['Mosaic', 'CHALLENGE', 'Thirteen obstacles laid out in a big number 8: a small loop on top and a larger loop below.', 'Before touching the screen, trace the route with your eyes from end to end.'],
      ['Shamrock Butterfly', 'MASTER', 'The clover meets the butterfly: four obstacles in the centre with the crossing rules, and four more at the corners like wings.', 'Only go to this course after earning gold on at least two others.']
    ] : [
      ['Butterfly Way', 'CLÁSSICO', 'A pista que dá nome ao jogo: quatro obstáculos inclinados formam as asas e um obstáculo listrado no meio é o corpo da borboleta.', 'Pense em passar pelo meio de um X: curvas abertas e sempre em frente.'],
      ['Butterfly Horizontal', 'VARIAÇÃO', 'A mesma ideia, deitada. O corpo listrado fica na horizontal e as asas se abrem para a esquerda e para a direita.', 'Olhe sempre para o próximo obstáculo, não para o que acabou de passar.'],
      ['Lemniscata', 'FLUIDO', 'Cinco obstáculos inclinados empilhados em zigue-zague, um depois do outro. Curvas alternadas e suaves premiam quem tem mãos leves.', 'Imagine um slalom de esqui: balance para a esquerda, para a direita e mantenha o ritmo.'],
      ['Shamrock', 'ESTRATÉGICO', 'O trevo: quatro obstáculos em quadrado e a regra das 3 e 2 travessias. Aqui a ordem importa tanto quanto a precisão.', 'Decida o par principal logo no primeiro cruzamento e conte em voz alta.'],
      ['Mosaico', 'DESAFIO', 'Treze obstáculos formando um grande número 8: uma volta pequena em cima e uma maior embaixo.', 'Antes de tocar na tela, trace a rota com os olhos de ponta a ponta.'],
      ['Shamrock Butterfly', 'MESTRE', 'O trevo encontra a borboleta: quatro obstáculos no centro com as regras de travessia e mais quatro nos cantos, como asas.', 'Só vá para esta pista depois de tirar ouro em pelo menos duas outras.']
    ];

      gameUrl: this.props.gameUrl ?? '#jogar',

      angleVal: a, angleVerdict: verdict, angleColor: col,
      curveD: 'M20,100 L100,100 L' + ex.toFixed(1) + ',' + ey.toFixed(1),

}

const TPL={pt:document.getElementById('tpl-dyn-pt').textContent,en:document.getElementById('tpl-dyn-en').textContent};
const STAT={pt:document.getElementById('tpl-stat-pt').textContent,en:document.getElementById('tpl-stat-en').textContent};
const comp=new Component({gameUrl:'jogo.html?v=5'});
let H={};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function get(p,ctx){p=p.trim();if(p==='true')return true;if(p==='false')return false;
 return p.split('.').reduce((o,k)=>o==null?undefined:o[k],ctx);}
function tpl(s,ctx){
 s=s.replace(/<sc-for list="\{\{([^}]+)\}\}" as="(\w+)"[^>]*>([\s\S]*?)<\/sc-for>/g,(_,l,as,inner)=>
   (get(l,ctx)||[]).map((it,i)=>tpl(inner,Object.assign({},ctx,{[as]:it,$index:i}))).join(''));
 s=s.replace(/<sc-if value="\{\{([^}]+)\}\}"[^>]*>([\s\S]*?)<\/sc-if>/g,(_,v,inner)=>get(v,ctx)?tpl(inner,ctx):'');
 s=s.replace(/on(Click|Input)="\{\{([^}]+)\}\}"/g,(_,ev,p)=>{const id='h'+Object.keys(H).length;H[id]=get(p,ctx);return 'data-'+ev.toLowerCase()+'="'+id+'"';});
 return s.replace(/\{\{\s*([^}]+?)\s*\}\}/g,(_,p)=>{const v=get(p,ctx);return v==null?'':esc(v);});}
function render(){H={};const root=document.getElementById('dyn');root.innerHTML=tpl(TPL[BW.lang],comp.renderVals());
 root.querySelectorAll('[data-click]').forEach(e=>e.onclick=H[e.dataset.click]);
 root.querySelectorAll('[data-input]').forEach(e=>e.oninput=H[e.dataset.input]);}
function renderStatic(){
 document.getElementById('stat').innerHTML=STAT[BW.lang];
 const box=document.getElementById('lang-toggle');
 ['pt','en'].forEach(l=>{const b=document.createElement('button');b.type='button';b.innerHTML=BW.flags[l];
  b.title=l==='pt'?'Português (Brasil)':'English (US)';b.setAttribute('aria-label',b.title);
  b.style.cssText='padding:3px;width:42px;height:31px;border-radius:7px;background:#fff;cursor:pointer;line-height:0;display:flex;align-items:center;justify-content:center;border:2px solid '+(l===BW.lang?'#0D7A55':'transparent')+';opacity:'+(l===BW.lang?1:.55);
  b.onclick=()=>setLang(l,true);box.appendChild(b);});
}
function setLang(l,manual){
 if(manual)BW.set(l);else BW.lang=l;
 document.documentElement.lang=l==='pt'?'pt-BR':'en';
 document.title=l==='pt'?'Butterfly Way — quebra-cabeça de salto':'Butterfly Way — show jumping puzzle';
 const md=document.querySelector('meta[name=description]');
 if(md)md.content=l==='pt'?'Desenhe com o dedo o trajeto perfeito entre os obstáculos e veja um cavalo 3D percorrê-lo. Jogue grátis no navegador.':'Draw the perfect path between the obstacles with your finger and watch a 3D horse ride it. Play free in your browser.';
 renderStatic();render();}
BW.onchange=l=>setLang(l,false);
setLang(BW.lang,false);
